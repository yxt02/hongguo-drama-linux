name: Restore Linux release history
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: restore-linux-history
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Copy and verify Linux releases
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: yxt02/hongguo-drama-linux
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import concurrent.futures,hashlib,json,os,pathlib,re,subprocess,tempfile,time
          source=os.environ['SOURCE_REPOSITORY']
          target=os.environ['TARGET_REPOSITORY']
          assert source != target
          def gh(args, optional=False):
              r=subprocess.run(['gh',*args],capture_output=True,text=True)
              if r.returncode and not optional:
                  raise RuntimeError('gh failed: '+r.stderr)
              return None if r.returncode else r.stdout
          rows=json.loads(gh(['api','repos/'+source+'/releases?per_page=100']))
          rows=[r for r in rows if re.fullmatch(r'v[0-9.]+-linux',r['tag_name']) and not r['draft']]
          latest=json.loads(gh(['api','repos/'+source+'/releases/latest']))['tag_name']
          assert len(rows)==9 and latest=='v1.74.8-linux'
          root=pathlib.Path(tempfile.mkdtemp(prefix='linux-releases-'))
          def restore(row):
              tag=row['tag_name']; folder=root/tag; folder.mkdir()
              gh(['release','download',tag,'--repo',source,'--dir',str(folder)])
              for asset in row['assets']:
                  if pathlib.Path(asset['name']).name!=asset['name']:raise ValueError('Invalid asset name')
                  p=folder/asset['name']
                  assert p.stat().st_size==asset['size'], 'Asset size mismatch'
                  if asset.get('digest','').startswith('sha256:'):
                      with p.open('rb') as f:digest=hashlib.file_digest(f,'sha256').hexdigest()
                      assert digest==asset['digest'].split(':',1)[1], 'Asset checksum mismatch'
              notes=folder/'release-notes.md';notes.write_text(row.get('body') or '')
              existing=gh(['release','view',tag,'--repo',target,'--json','isDraft'],optional=True)
              if existing is None:
                  args=['release','create',tag,'--repo',target,'--draft','--verify-tag','--title',row['name'] or tag,'--notes-file',str(notes)]
                  if row['prerelease']:args.append('--prerelease')
                  gh(args)
              files=[str(folder/a['name']) for a in row['assets']]
              for attempt in range(3):
                  try:
                      gh(['release','upload',tag,'--repo',target,*files,'--clobber'])
                      break
                  except RuntimeError:
                      if attempt==2:raise
                      time.sleep(3)
              gh(['release','edit',tag,'--repo',target,'--draft=false','--latest='+('true' if tag==latest else 'false')])
              uploaded=json.loads(gh(['api','repos/'+target+'/releases/tags/'+tag]))
              assets={a['name']:a for a in uploaded['assets']}
              assert len(assets)==len(row['assets'])
              for asset in row['assets']:
                  other=assets[asset['name']]
                  assert other['state']=='uploaded' and other['size']==asset['size']
                  if asset.get('digest'):assert other.get('digest')==asset['digest']
              print('VERIFIED '+tag+' ('+str(len(assets))+' assets)',flush=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              list(pool.map(restore,rows))
          gh(['release','edit',latest,'--repo',target,'--latest'])
          assert json.loads(gh(['api','repos/'+target+'/releases/latest']))['tag_name']==latest
          print('VERIFIED all 9 releases and 23 assets; latest='+latest,flush=True)
          PY
